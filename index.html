<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEC English Practice Quiz (50 Questions)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --correct: #22c55e;
            --incorrect: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .question-counter {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: #1a2436;
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--correct) !important;
            color: #4ade80;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--incorrect) !important;
            color: #f87171;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .next-btn, .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: var(--primary-hover);
        }

        .next-btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .feedback-msg {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <h1>AEC English Examination Practice</h1>
            <p>50 Random Questions Selected</p>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-counter" id="question-counter">Question 1 of 50</div>
        <div class="question-text" id="question-text">Loading Question...</div>

        <div class="options-container" id="options-container"></div>

        <div class="controls">
            <button class="next-btn" id="next-btn" disabled>Next Question</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-display" id="score-display">0 / 50</div>
        <p class="feedback-msg" id="feedback-msg"></p>
        <button class="restart-btn" id="restart-btn">Try Another Set</button>
    </div>
</div>
